<meta charset="UTF-8">

<title>ニュース | ヌルヌルFX</title>
<link rel="icon" href="ojisan.svg" type="image/svg+xml">
<style>
body { margin:0; font-family:sans-serif; background:#0f172a; color:#e2e8f0; line-height:1.8; }
header { padding:28px 20px; text-align:center; background:linear-gradient(120deg,#0b1a33,#1d4ed8,#0b1a33); }
header a { color:#bae6fd; text-decoration:none; font-size:.9rem; }
header h1 { margin:6px 0 0; }
main { max-width:800px; margin:auto; padding:20px 16px; }
.card { background:#1e293b; border-radius:12px; padding:20px; margin-bottom:16px; }
.card h2 { color:#38bdf8; margin:0 0 8px; font-size:1.2rem; }
.card p { margin:0 0 8px; }
.note { font-size:.85rem; color:#94a3b8; }
a.inline { color:#38bdf8; }
.tl { min-height:200px; }
.tl a.twitter-timeline { color:#38bdf8; }
.open-x { display:inline-block; margin-top:4px; padding:6px 16px; border:1px solid #38bdf8; border-radius:999px; color:#38bdf8; text-decoration:none; font-size:.9rem; }
.open-x:hover { background:rgba(56,189,248,.12); }
#tlFail { border:1px solid #facc15; background:rgba(250,204,21,.08); color:#fde68a; border-radius:8px; padding:12px; margin-top:8px; }
@media (max-width:560px){ .card { padding:16px 12px; } }
footer { text-align:center; font-size:.8rem; color:#94a3b8; padding:20px; }
</style>
</head>
<body>
<header>
  <a href="index.html">← ヌルヌルFX トップへ</a>
  <h1>ニュース</h1>
</header>

<main>
  <div class="card">
    <h2>X のニュースリスト</h2>
    <p>為替・経済のニュースを流しているアカウントを、X(旧Twitter)のリストにまとめています。新しいポストが上に出ます。</p>
    <a class="open-x" href="https://x.com/i/lists/2126657545783656719" target="_blank" rel="noopener">X でリストを開く</a>
  </div>

  <div class="card tl">
    <a class="twitter-timeline" data-theme="dark" data-lang="ja" data-height="1400" data-chrome="noheader nofooter transparent" data-dnt="true"
       href="https://twitter.com/i/lists/2126657545783656719?ref_src=twsrc%5Etfw">リストを読み込み中…</a>
    <div id="tlFail" hidden>リストを表示できませんでした。X の仕組みで、X にログインしていないと表示されないことがあります。上の「X でリストを開く」から見てください。</div>
  </div>

  <p class="note">※ポストの内容は各アカウントのものです。発表直後のニュースは数字が訂正されることもあるので、トレードの前に公式の発表も確かめてください。</p>
</main>

<footer>※本サイトは個人の記録であり、投資助言ではありません。</footer>
<script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
<script>
// 10秒たってもリストが出なければ(ログインしていない・読み込みを止められたなど)、X で開くよう案内する
setTimeout(function(){
  if (document.querySelector('.tl iframe')) return;
  document.getElementById('tlFail').hidden = false;
  var a = document.querySelector('.tl a.twitter-timeline'); if (a) a.hidden = true;
}, 10000);
</script>
</body>
</html>
