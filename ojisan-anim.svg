    <circle cx="104" cy="54" r="21" fill="url(#nSkin)"/>
    <!-- てっぺんのクルン毛 -->
    <path d="M104 33 C103 24 108 18 114 19 C120 20 120 28 114 29 C110 30 109 25 112 24" fill="none" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round"/>
    <!-- 頭のテカり -->
    <ellipse cx="95" cy="41" rx="7" ry="3.5" fill="#fff" opacity=".9" transform="rotate(-28 95 41)"/>
    <!-- 横の髪 -->
    <path d="M84 54 C83 61 85 66 88 69 M124 54 C125 61 123 66 120 69" fill="none" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
    <!-- 丸い黒サングラス -->
    <circle cx="96" cy="53" r="7.5" fill="#0b0f19" stroke="#000" stroke-width="1.5"/>
    <circle cx="113" cy="53" r="7.5" fill="#0b0f19" stroke="#000" stroke-width="1.5"/>
    <path d="M103.5 52 Q104.5 50 105.5 52" fill="none" stroke="#000" stroke-width="2"/>
    <path d="M88.5 52 L85 51 M120.5 52 L124 51" stroke="#000" stroke-width="2" stroke-linecap="round"/>
    <circle cx="93.5" cy="50.5" r="2" fill="#fff" opacity=".7"/>
    <circle cx="110.5" cy="50.5" r="2" fill="#fff" opacity=".7"/>
    <!-- 口 -->
    <path d="M99 66 Q104.5 71 110 66" fill="none" stroke="#9f1239" stroke-width="2.4" stroke-linecap="round"/>

    <g opacity="0"><path d="M79 40 c2 4 4 6 4 8 a3 3 0 0 1 -6 0 c0 -2 1 -4 2 -8 z" fill="#7dd3fc" stroke="#0284c7" stroke-width=".6"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;-12 -10" dur="1.2s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.6;1" dur="1.2s" begin="0s" repeatCount="indefinite"/></g>
    <g opacity="0"><path d="M129 40 c2 4 4 6 4 8 a3 3 0 0 1 -6 0 c0 -2 1 -4 2 -8 z" fill="#7dd3fc" stroke="#0284c7" stroke-width=".6"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;12 -10" dur="1.2s" begin=".7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.6;1" dur="1.2s" begin=".7s" repeatCount="indefinite"/></g>
    <g opacity="0"><path d="M104 84 c1.4 2.8 2.8 4.199999999999999 2.8 5.6 a2.0999999999999996 2.0999999999999996 0 0 1 -4.199999999999999 0 c0 -1.4 0.7 -2.8 1.4 -5.6 z" fill="#7dd3fc" stroke="#0284c7" stroke-width=".6"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 18" dur="1.8s" begin=".2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.6;1" dur="1.8s" begin=".2s" repeatCount="indefinite"/></g>
    <g opacity="0"><path d="M112 86 c1.2 2.4 2.4 3.5999999999999996 2.4 4.8 a1.7999999999999998 1.7999999999999998 0 0 1 -3.5999999999999996 0 c0 -1.2 0.6 -2.4 1.2 -4.8 z" fill="#7dd3fc" stroke="#0284c7" stroke-width=".6"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;1 16" dur="1.8s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.6;1" dur="1.8s" begin="1.1s" repeatCount="indefinite"/></g>
        </g>
    <circle cx="66" cy="154" r="3.0" fill="#ffffff" stroke="#38bdf8" stroke-width=".6" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="0 0;-26 6" dur="1.2s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.95;0" dur="1.2s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="66" cy="154" r="2.5" fill="#ffffff" stroke="#38bdf8" stroke-width=".6" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="0 0;-34 -4" dur="1.2s" begin=".4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.95;0" dur="1.2s" begin=".4s" repeatCount="indefinite"/></circle>
    <circle cx="66" cy="154" r="2.0" fill="#ffffff" stroke="#38bdf8" stroke-width=".6" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="0 0;-22 12" dur="1.2s" begin=".8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.95;0" dur="1.2s" begin=".8s" repeatCount="indefinite"/></circle>
    <circle cx="66" cy="154" r="1.5" fill="#ffffff" stroke="#38bdf8" stroke-width=".6" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="0 0;-30 2" dur="1.2s" begin=".2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.95;0" dur="1.2s" begin=".2s" repeatCount="indefinite"/></circle>
      </g>
    </g>
  </g>
</svg>
