<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="nSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cdeafe"/></linearGradient>
    <linearGradient id="nSea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
    <radialGradient id="nSkin" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#ffe6cc"/><stop offset=".6" stop-color="#f4bf92"/><stop offset="1" stop-color="#d9935f"/></radialGradient>
    <clipPath id="nClip"><rect x="2" y="2" width="196" height="196" rx="40"/></clipPath>
  </defs>
  <g clip-path="url(#nClip)">
    <rect width="200" height="200" fill="url(#nSky)"/>
    <!-- 背景のローソク足 -->
    <g opacity=".45"><animate attributeName="opacity" values=".3;.55;.3" dur="4s" repeatCount="indefinite"/>
      <line x1="26" y1="92" x2="26" y2="130" stroke="#4ade80" stroke-width="2"/><rect x="21" y="100" width="10" height="20" fill="#4ade80"/>
      <line x1="46" y1="80" x2="46" y2="116" stroke="#f87171" stroke-width="2"/><rect x="41" y="88" width="10" height="16" fill="#f87171"/>
      <line x1="156" y1="36" x2="156" y2="76" stroke="#4ade80" stroke-width="2"/><rect x="151" y="44" width="10" height="24" fill="#4ade80"/>
      <line x1="176" y1="22" x2="176" y2="60" stroke="#4ade80" stroke-width="2"/><rect x="171" y="28" width="10" height="24" fill="#4ade80"/>
    </g>
    <!-- 上昇トレンドの波 -->
    <path d="M0 172 C30 162 50 174 75 152 C100 130 120 142 140 120 C160 98 180 106 200 88 L200 200 L0 200 Z" fill="url(#nSea)"><animate attributeName="d" values="M0 172 C30 162 50 174 75 152 C100 130 120 142 140 120 C160 98 180 106 200 88 L200 200 L0 200 Z;M0 166 C30 172 50 162 75 158 C100 136 120 134 140 126 C160 104 180 98 200 94 L200 200 L0 200 Z;M0 172 C30 162 50 174 75 152 C100 130 120 142 140 120 C160 98 180 106 200 88 L200 200 L0 200 Z" dur="2.4s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></path>
    <path d="M0 172 C30 162 50 174 75 152 C100 130 120 142 140 120 C160 98 180 106 200 88" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"><animate attributeName="d" values="M0 172 C30 162 50 174 75 152 C100 130 120 142 140 120 C160 98 180 106 200 88;M0 166 C30 172 50 162 75 158 C100 136 120 134 140 126 C160 104 180 98 200 94;M0 172 C30 162 50 174 75 152 C100 130 120 142 140 120 C160 98 180 106 200 88" dur="2.4s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></path>
    <g>
      <animateTransform attributeName="transform" type="translate" values="-32 14;32 -14;-32 14" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 2;0 -5;0 2" dur="2.4s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-3 104 120;3 104 120;-3 104 120" dur="2.4s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
    <!-- サーフボード -->
    <g transform="rotate(-24 104 136)">
      <ellipse cx="104" cy="136" rx="46" ry="8" fill="#facc15"/>
      <ellipse cx="104" cy="136" rx="46" ry="8" fill="none" stroke="#b45309" stroke-width="2"/>
      <line x1="64" y1="136" x2="144" y2="136" stroke="#b45309" stroke-width="1.5" opacity=".6"/>
    </g>

    <!-- 脚 -->
    <path d="M98 112 Q90 122 86 132" fill="none" stroke="url(#nSkin)" stroke-width="10" stroke-linecap="round"/>
    <path d="M112 110 Q120 114 122 118" fill="none" stroke="url(#nSkin)" stroke-width="10" stroke-linecap="round"/>
