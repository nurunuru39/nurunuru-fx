<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="nSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cdeafe"/></linearGradient>
    <linearGradient id="nSea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
    <radialGradient id="nSkin" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#ffe6cc"/><stop offset=".6" stop-color="#f4bf92"/><stop offset="1" stop-color="#d9935f"/></radialGradient>
    <clipPath id="nClip"><rect x="2" y="2" width="196" height="196" rx="40"/></clipPath>
  </defs>
  <g clip-path="url(#nClip)">
    <rect width="200" height="200" fill="url(#nSky)"/>
    <!-- 背景のローソク足 -->
    <g opacity=".45">
      <line x1="26" y1="92" x2="26" y2="130" stroke="#4ade80" stroke-width="2"/><rect x="21" y="100" width="10" height="20" fill="#4ade80"/>
      <line x1="46" y1="80" x2="46" y2="116" stroke="#f87171" stroke-width="2"/><rect x="41" y="88" width="10" height="16" fill="#f87171"/>
      <line x1="156" y1="36" x2="156" y2="76" stroke="#4ade80" stroke-width="2"/><rect x="151" y="44" width="10" height="24" fill="#4ade80"/>
      <line x1="176" y1="22" x2="176" y2="60" stroke="#4ade80" stroke-width="2"/><rect x="171" y="28" width="10" height="24" fill="#4ade80"/>
    </g>
    <!-- 上昇トレンドの波 -->
    <path d="M0 172 C30 162 50 174 75 152 C100 130 120 142 140 120 C160 98 180 106 200 88 L200 200 L0 200 Z" fill="url(#nSea)"/>
    <path d="M0 172 C30 162 50 174 75 152 C100 130 120 142 140 120 C160 98 180 106 200 88" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <!-- サーフボード -->
    <g transform="rotate(-24 104 136)">
      <ellipse cx="104" cy="136" rx="46" ry="8" fill="#facc15"/>
      <ellipse cx="104" cy="136" rx="46" ry="8" fill="none" stroke="#b45309" stroke-width="2"/>
      <line x1="64" y1="136" x2="144" y2="136" stroke="#b45309" stroke-width="1.5" opacity=".6"/>
    </g>

    <!-- 脚 -->
    <path d="M98 112 Q90 122 86 132" fill="none" stroke="url(#nSkin)" stroke-width="10" stroke-linecap="round"/>
    <path d="M112 110 Q120 114 122 118" fill="none" stroke="url(#nSkin)" stroke-width="10" stroke-linecap="round"/>
    <!-- 腕 -->
    <path d="M94 80 Q80 80 68 88" fill="none" stroke="url(#nSkin)" stroke-width="9" stroke-linecap="round"/>
    <path d="M118 76 Q132 70 142 60" fill="none" stroke="url(#nSkin)" stroke-width="9" stroke-linecap="round"/>
    <!-- 体(ぽっこりお腹) -->
    <ellipse cx="106" cy="94" rx="18" ry="20" fill="url(#nSkin)"/>
    <!-- 黒い海パン(太ももまでしっかり) -->
    <path d="M88 99 Q106 108 124 97 L127 113 Q126 121 117 122 L110 115 L104 124 Q94 128 86 120 Z" fill="#111827"/>
    <path d="M88.5 102 Q106 111 124.5 100" fill="none" stroke="#374151" stroke-width="2"/>
    <path d="M110 115 L109 108" stroke="#374151" stroke-width="1.5"/>
    <!-- おへそ -->
    <path d="M107 92 q2 2 0 4" fill="none" stroke="#b9774a" stroke-width="1.5" stroke-linecap="round"/>
    <!-- ヌルヌルのテカり -->
    <ellipse cx="99" cy="85" rx="5" ry="8" fill="#fff" opacity=".75" transform="rotate(20 99 85)"/>
    <ellipse cx="80" cy="81" rx="5" ry="1.8" fill="#fff" opacity=".7" transform="rotate(-8 80 81)"/>
    <ellipse cx="132" cy="68" rx="5" ry="1.8" fill="#fff" opacity=".7" transform="rotate(-40 132 68)"/>
    <ellipse cx="89" cy="127" rx="1.6" ry="3.5" fill="#fff" opacity=".65" transform="rotate(30 92 121)"/>

    <!-- ヌルヌル追加:テカりの筋 -->
    <g class="shine">
    <path d="M95 80 Q92 92 96 104" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity=".8"/>
    <ellipse cx="116" cy="88" rx="2.2" ry="6" fill="#fff" opacity=".55" transform="rotate(-15 116 88)"/>
    <ellipse cx="112" cy="40" rx="3" ry="1.6" fill="#fff" opacity=".8" transform="rotate(20 112 40)"/>
    <ellipse cx="74" cy="85" rx="2.4" ry="1.2" fill="#fff" opacity=".8"/>
    <ellipse cx="139" cy="61" rx="2.4" ry="1.2" fill="#fff" opacity=".8" transform="rotate(-45 139 61)"/>
    </g>
    <!-- 肌に垂れるしずく -->
    <path d="M100 74 c1.5 3 2.5 5 2.5 6.5 a2.5 2.5 0 0 1 -5 0 c0 -1.5 1 -3.5 2.5 -6.5 z" fill="#bae6fd" stroke="#38bdf8" stroke-width=".8"/>
    <path d="M118 79 c1.3 2.6 2.2 4.3 2.2 5.6 a2.2 2.2 0 0 1 -4.4 0 c0 -1.3 .9 -3 2.2 -5.6 z" fill="#bae6fd" stroke="#38bdf8" stroke-width=".8"/>
    <!-- 頭 -->
    <circle cx="104" cy="54" r="21" fill="url(#nSkin)"/>
    <!-- てっぺんのクルン毛 -->
    <path d="M104 33 C103 24 108 18 114 19 C120 20 120 28 114 29 C110 30 109 25 112 24" fill="none" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round"/>
    <!-- 頭のテカり -->
    <ellipse cx="95" cy="41" rx="7" ry="3.5" fill="#fff" opacity=".9" transform="rotate(-28 95 41)"/>
    <!-- 横の髪 -->
    <path d="M84 54 C83 61 85 66 88 69 M124 54 C125 61 123 66 120 69" fill="none" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
    <!-- 丸い黒サングラス -->
    <circle cx="96" cy="53" r="7.5" fill="#0b0f19" stroke="#000" stroke-width="1.5"/>
    <circle cx="113" cy="53" r="7.5" fill="#0b0f19" stroke="#000" stroke-width="1.5"/>
    <path d="M103.5 52 Q104.5 50 105.5 52" fill="none" stroke="#000" stroke-width="2"/>
    <path d="M88.5 52 L85 51 M120.5 52 L124 51" stroke="#000" stroke-width="2" stroke-linecap="round"/>
    <circle cx="93.5" cy="50.5" r="2" fill="#fff" opacity=".7"/>
    <circle cx="110.5" cy="50.5" r="2" fill="#fff" opacity=".7"/>
    <!-- 口 -->
    <path d="M99 66 Q104.5 71 110 66" fill="none" stroke="#9f1239" stroke-width="2.4" stroke-linecap="round"/>

    <!-- 飛び散る汗 -->
    <path d="M79 40 C81 44 83 46 83 48 A3 3 0 0 1 77 48 C77 46 78 44 79 40 Z" fill="#7dd3fc"/>
    <path d="M129 40 C131 44 133 46 133 48 A3 3 0 0 1 127 48 C127 46 128 44 129 40 Z" fill="#7dd3fc"/>
    <path d="M128 92 C130 96 131 98 131 100 A3 3 0 0 1 125 100 C125 98 126 96 128 92 Z" fill="#7dd3fc"/>
  </g>
</svg>
